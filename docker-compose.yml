services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      RESPONSE_MODE: ${RESPONSE_MODE:-simulate}
    volumes:
      - ./data:/app/data
      - ./cyber.db:/app/cyber.db
